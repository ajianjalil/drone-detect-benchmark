# VisDrone2019-DET — local (avcom) dataset config
#
# Points at a symlink tree that mirrors the copy under
# phd_research/dygrid_edgeyolo/data/VisDrone2019 without sharing its
# labels.cache. YOLOv5 writes <root>/<split>/labels.cache into this tree only,
# leaving the ultralytics caches in phd_research untouched.
#
# No `download:` block on purpose — the data is already on disk.

path: /home/avcom/Documents/ajith/visdrone_yolov5 # dataset root dir
train: VisDrone2019-DET-train/images # 6471 images
val: VisDrone2019-DET-val/images # 548 images
test: VisDrone2019-DET-test-dev/images # 1610 images (labelled, usable for held-out eval)

# Classes
names:
  0: pedestrian
  1: people
  2: bicycle
  3: car
  4: van
  5: truck
  6: tricycle
  7: awning-tricycle
  8: bus
  9: motor
