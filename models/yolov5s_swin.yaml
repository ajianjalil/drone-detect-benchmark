# YOLOv5s + single SwinStage at P5 — RECONSTRUCTED, not recovered.
#
# The paper's YOLOv5s+SingleSwin row (mAP@0.5 0.3484) and Figures 3-4 come from
# runs/train/yolov5_s_swin, which was a `resume: true` from a container checkpoint
# (/app/yolov5) with `cfg: ''`. That checkpoint is gone and no s-scale single-Swin
# config has ever existed in this repo or its git history — models/yolov5_swin.yaml
# is width_multiple 0.25 (nano, 6.7 MB, = Table I's YOLOv5n+SingleSwin row).
#
# This file is models/yolov5_swin.yaml at s scale (width 0.50) with nc: 10.
# Evidence it is the right architecture: 13,352,151 params = 26.7 MB fp16, against
# Table I's "26 MB" for YOLOv5s+SingleSwin (yolov5s = 14.1 vs "14"; yolov5s_swin2 =
# 26.8 vs "26"). A parameter count cannot uniquely identify an architecture, so this
# is strong evidence, not proof. The seed runs in run_arch_seeds.sh are themselves a
# test: if they do not land near 0.3484, the reconstruction is wrong.
#
# See docs/SUMMARY.md §4.
# Parameters
nc: 10  # number of classes (VisDrone)
#ch: 1   # no. input channel
depth_multiple: 0.33  # model depth multiple
width_multiple: 0.50  # layer channel multiple (s scale)
anchors:
  - [10,13, 16,30, 33,23]  # P3/8
  - [30,61, 62,45, 59,119]  # P4/16
  - [116,90, 156,198, 373,326]  # P5/32

# YOLOv5 v6.0 backbone
backbone:
  # [from, number, module, args]
  # input [b, 1, 640, 640]
  [[-1, 1, Conv, [64, 6, 2, 2]],  # 0-P1/2 [b, 64, 320, 320]
   [-1, 1, Conv, [128, 3, 2]],  # 1-P2/4 [b, 128, 160, 160]
   [-1, 3, C3, [128]],
   [-1, 1, Conv, [256, 3, 2]],  # 3-P3/8 [b, 256, 80, 80]
   [-1, 6, C3, [256]],
   [-1, 1, Conv, [512, 3, 2]],  # 5-P4/16 [b, 512, 40, 40]
   [-1, 9, C3, [512]],
   [-1, 1, Conv, [1024, 3, 2]],  # 7-P5/32 [b, 1024, 20, 20]
   [-1, 3, C3, [1024]],
   [-1, 1, SwinStage, [1024, 2, 8, 4]], # [outputChannel, blockDepth, numHeaders, windowSize]
   [-1, 1, SPPF, [1024, 5]],  # 10
  ]

# YOLOv5 v6.0 head
head:
  [[-1, 1, Conv, [512, 1, 1]],
   [-1, 1, nn.Upsample, [None, 2, 'nearest']],
   [[-1, 6], 1, Concat, [1]],  # cat backbone P4
   [-1, 3, C3, [512, False]],  # 14

   [-1, 1, Conv, [256, 1, 1]],
   [-1, 1, nn.Upsample, [None, 2, 'nearest']],
   [[-1, 4], 1, Concat, [1]],  # cat backbone P3
   [-1, 3, C3, [256, False]],  # 18 (P3/8-small)

   [-1, 1, Conv, [256, 3, 2]],
   [[-1, 15], 1, Concat, [1]],  # cat head P4
   [-1, 3, C3, [512, False]],  # 21 (P4/16-medium)

   [-1, 1, Conv, [512, 3, 2]],
   [[-1, 11], 1, Concat, [1]],  # cat head P5
   [-1, 3, C3, [1024, False]],  # 24 (P5/32-large)

   [[18, 21, 24], 1, Detect, [nc, anchors]],  # Detect(P3, P4, P5)
  ]
