# YOLOv5s + P2 detection head + SwinStage on the P2 NECK branch (arm C).
#
# PLACEMENT, stated explicitly per the revision plan's pre-flight check: the
# SwinStage operates on the *neck* P2 branch, immediately after the P2 fusion C3
# (backbone P2 concatenated with the upsampled P3 path) and immediately before the
# P2 Detect head. It does NOT touch the backbone P2 feature map. This makes B and C
# differ by exactly one module, which is what the B-vs-C contrast requires.
#
# window_size 8 at a 160x160 map = 20x20 windows, each seeing 32x32 px of input.
#
# Rationale: at stride 32 a VisDrone pedestrian is 0.17x0.53 feature cells; at
# stride 8 it is 0.69x2.13; at stride 4 it is 1.37x4.27. Detection at P2 is the
# first stride at which small objects have a real spatial footprint.
#
# Structure from models/hub/yolov5-p2.yaml at s scale. Run this BEFORE adding
# attention: if the gain is here, attention is not the contribution.
nc: 10
depth_multiple: 0.33
width_multiple: 0.50
anchors: 3  # AutoAnchor evolves 3 anchors per output layer (4 layers now)

backbone:
  [[-1, 1, Conv, [64, 6, 2, 2]],   # 0-P1/2
   [-1, 1, Conv, [128, 3, 2]],     # 1-P2/4
   [-1, 3, C3, [128]],             # 2
   [-1, 1, Conv, [256, 3, 2]],     # 3-P3/8
   [-1, 6, C3, [256]],             # 4
   [-1, 1, Conv, [512, 3, 2]],     # 5-P4/16
   [-1, 9, C3, [512]],             # 6
   [-1, 1, Conv, [1024, 3, 2]],    # 7-P5/32
   [-1, 3, C3, [1024]],            # 8
   [-1, 1, SPPF, [1024, 5]],       # 9
  ]

head:
  [[-1, 1, Conv, [512, 1, 1]],                 # 10
   [-1, 1, nn.Upsample, [None, 2, 'nearest']], # 11
   [[-1, 6], 1, Concat, [1]],                  # 12
   [-1, 3, C3, [512, False]],                  # 13
   [-1, 1, Conv, [256, 1, 1]],                 # 14
   [-1, 1, nn.Upsample, [None, 2, 'nearest']], # 15
   [[-1, 4], 1, Concat, [1]],                  # 16
   [-1, 3, C3, [256, False]],                  # 17
   [-1, 1, Conv, [128, 1, 1]],                 # 18
   [-1, 1, nn.Upsample, [None, 2, 'nearest']], # 19
   [[-1, 2], 1, Concat, [1]],                  # 20  cat backbone P2
   [-1, 1, C3, [128, False]],                  # 21  (P2/4-xsmall) after fusion
   [-1, 1, SwinStage, [128, 4, 4, 8]],         # 22  <-- Swin@P2, NECK branch, window 8, depth 4
   [-1, 1, Conv, [128, 3, 2]],                 # 23
   [[-1, 18], 1, Concat, [1]],                 # 24
   [-1, 3, C3, [256, False]],                  # 25  (P3/8-small)
   [-1, 1, Conv, [256, 3, 2]],                 # 26
   [[-1, 14], 1, Concat, [1]],                 # 27
   [-1, 3, C3, [512, False]],                  # 28  (P4/16-medium)
   [-1, 1, Conv, [512, 3, 2]],                 # 29
   [[-1, 10], 1, Concat, [1]],                 # 30
   [-1, 3, C3, [1024, False]],                 # 31  (P5/32-large)
   [[22, 25, 28, 31], 1, Detect, [nc, anchors]],
  ]
