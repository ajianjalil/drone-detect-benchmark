# YOLOv5s + SwinStage at P3 in the NECK (after PANet fusion), window_size 8.
#
# Contrast with models/yolov5s_swin.yaml, which puts attention at P5/32 where a
# pedestrian is 0.17x0.53 cells (sub-pixel — nothing to attend to). At P3/8 it is
# 0.69x2.13 cells, and window_size 8 gives each window a 64x64 px view (~4x
# pedestrian height) over semantically fused features rather than raw backbone ones.
# depth 4 = two W-MSA/SW-MSA pairs instead of one.
# Ultralytics 🚀 AGPL-3.0 License - https://ultralytics.com/license

# Parameters
nc: 10 # number of classes
depth_multiple: 0.33 # model depth multiple
width_multiple: 0.50 # layer channel multiple
anchors:
  - [10, 13, 16, 30, 33, 23] # P3/8
  - [30, 61, 62, 45, 59, 119] # P4/16
  - [116, 90, 156, 198, 373, 326] # P5/32

# YOLOv5 v6.0 backbone
backbone:
  # [from, number, module, args]
  [
    [-1, 1, Conv, [64, 6, 2, 2]], # 0-P1/2
    [-1, 1, Conv, [128, 3, 2]], # 1-P2/4
    [-1, 3, C3, [128]],
    [-1, 1, Conv, [256, 3, 2]], # 3-P3/8
    [-1, 6, C3, [256]],
    [-1, 1, Conv, [512, 3, 2]], # 5-P4/16
    [-1, 9, C3, [512]],
    [-1, 1, Conv, [1024, 3, 2]], # 7-P5/32
    [-1, 3, C3, [1024]],
    [-1, 1, SPPF, [1024, 5]], # 9
  ]

# YOLOv5 v6.0 head
head:
  [[-1, 1, Conv, [512, 1, 1]],                 # 10
   [-1, 1, nn.Upsample, [None, 2, 'nearest']], # 11
   [[-1, 6], 1, Concat, [1]],                  # 12
   [-1, 3, C3, [512, False]],                  # 13
   [-1, 1, Conv, [256, 1, 1]],                 # 14
   [-1, 1, nn.Upsample, [None, 2, 'nearest']], # 15
   [[-1, 4], 1, Concat, [1]],                  # 16
   [-1, 3, C3, [256, False]],                  # 17  P3/8 after fusion
   [-1, 1, SwinStage, [256, 4, 8, 8]],         # 18  <-- attention at P3, window 8 (64x64 px), depth 4
   [-1, 1, Conv, [256, 3, 2]],                 # 19
   [[-1, 14], 1, Concat, [1]],                 # 20
   [-1, 3, C3, [512, False]],                  # 21  (P4/16-medium)
   [-1, 1, Conv, [512, 3, 2]],                 # 22
   [[-1, 10], 1, Concat, [1]],                 # 23
   [-1, 3, C3, [1024, False]],                 # 24  (P5/32-large)
   [[18, 21, 24], 1, Detect, [nc, anchors]],
  ]
